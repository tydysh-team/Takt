name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-checks:
    name: Fast checks
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://takt:test-only@127.0.0.1:5432/unused_unit_db
      JWT_SECRET_KEY: test-jwt-key-which-is-longer-than-thirty-two-characters
      REFRESH_TOKEN_HMAC_KEY: test-refresh-key-which-is-longer-than-thirty-two-characters
      RATE_LIMIT_HMAC_KEY: test-rate-limit-key-which-is-longer-than-thirty-two-characters
      INVITATION_CODE_SECRET: test-invitation-key-which-is-longer-than-thirty-two-characters
      ADMIN_SESSION_SECRET: test-admin-session-key-which-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app tests alembic
      - name: mypy
        run: mypy app
      - name: Unit tests without PostgreSQL
        run: pytest tests/unit -q

  full-checks:
    name: Full checks
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'dev')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: takt
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: takt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U takt -d takt_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://takt:test-only@127.0.0.1:5432/takt_test
      TEST_DATABASE_URL: postgresql+asyncpg://takt:test-only@127.0.0.1:5432/takt_test
      JWT_SECRET_KEY: test-jwt-key-which-is-longer-than-thirty-two-characters
      REFRESH_TOKEN_HMAC_KEY: test-refresh-key-which-is-longer-than-thirty-two-characters
      RATE_LIMIT_HMAC_KEY: test-rate-limit-key-which-is-longer-than-thirty-two-characters
      INVITATION_CODE_SECRET: test-invitation-key-which-is-longer-than-thirty-two-characters
      ADMIN_SESSION_SECRET: test-admin-session-key-which-is-longer-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install Backend dependencies
        run: python -m pip install -e '.[dev]'
      - name: Migrate disposable test database
        run: alembic upgrade head
      - name: All Backend tests
        run: pytest tests -q
